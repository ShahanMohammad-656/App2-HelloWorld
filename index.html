<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photo Transform</title>
  <meta name="viewport" content="width=device-width, initial-scale=.7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

  <script>
    function detectColor(r, g, b) {
      if (r >= 200 && g >= 15 && g <= 200 && b >= 100) {
        return "Pink - No amplification";
      }
      if (r >= 200 && g >= 100 && g <= 180 && b <= 80) {
        return "Orange - Amplifying";
      }
      if (r >= 200 && g >= 190 && b <= 100) {
        return "Yellow - Amplified";
      }
      return "Other color";
    }

    window.onload = function () {
      const canvas = document.getElementById('myCanvas');
      const context = canvas.getContext("2d");

      const canvas2 = document.getElementById('dataCanvas');
      const context2 = canvas2.getContext("2d");

      const fileInput = document.getElementById('fileInput');
      const messageDisplayArea = document.getElementById('messageDisplayArea');

      let imageLoaded = false;

      context.font = '20pt Calibri';
      context.fillStyle = "black";
      context.fillText("Original image will go here", 10, 20);

      // Clear the second canvas
      context2.clearRect(0, 0, canvas2.width, canvas2.height);

      fileInput.addEventListener('change', function () {
        const file = fileInput.files[0];
        const imageType = /image.*/;

        if (file && file.type.match(imageType)) {
          const reader = new FileReader();

          reader.onload = function (e) {
            messageDisplayArea.innerHTML = "You picked an image!";
            const img = new Image();

            img.onload = function () {
              context.clearRect(0, 0, canvas.width, canvas.height);
              context.drawImage(img, 0, 0, 600, 500);
              imageLoaded = true;
            };

            img.src = reader.result;
          };

          reader.readAsDataURL(file);
        } else {
          messageDisplayArea.innerHTML = "File not supported!";
        }
      });

      // Click handler for pixel selection
      canvas.addEventListener("click", function (event) {
        if (!imageLoaded) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(event.clientX - rect.left);
        const y = Math.floor(event.clientY - rect.top);
        const pixel = context.getImageData(x, y, 1, 1).data;
        const [r, g, b, a] = pixel;

        const label = detectColor(r, g, b);

        // Show text output below upload
        messageDisplayArea.innerHTML = `
          <div><strong>Clicked Position:</strong> (${x}, ${y})</div>
          <div><strong>RGB:</strong> R=${r}, G=${g}, B=${b}</div>
          <div><strong>Detected Label:</strong> <span style="color: #aa0000">${label}</span></div>
        `;

        // Write result to second canvas
        context2.clearRect(0, 0, canvas2.width, canvas2.height);
        context2.font = '24pt Calibri';
        context2.fillStyle = "#000088";
        context2.fillText(`Detected: ${label}`, 20, 60);
      });
    };
  </script>
</head>

<body>
  <div data-role="page">
    <div data-role="header">
      <h1>Primary Colors</h1>
    </div>

    <div data-role="content">
      <h2>Push button to take picture.</h2>
      <div>
        Press orange button to create or choose image file:
        <input type="file" id="fileInput" style="background-color: #FF6600;">
      </div>
      <div id="messageDisplayArea" style="margin-top:10px; font-size: 16px;"></div>

      <canvas id="myCanvas" width="600" height="500" style="border:1px solid #d3d3d3; margin-top:10px;"></canvas>

      <canvas id="dataCanvas" width="600" height="500" style="border:1px solid #d3d3d3; margin-top:10px;"></canvas>
    </div>

    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics</p>
    </div>
  </div>
</body>
</html>
